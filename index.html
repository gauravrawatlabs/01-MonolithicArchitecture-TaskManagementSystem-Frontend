<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Task Management System — projects, tasks, Kanban board and team collaboration."
    />
    <meta name="theme-color" content="#6D4AFF" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Task Management System</title>
    <!--
      Applies the saved theme BEFORE the app loads, so dark-mode users never see a white flash.
      Must stay tiny and dependency-free. Key "tms.theme" = THEME_STORAGE_KEY in src/services/preferencesStorage.ts.
    -->
    <script>
      (function () {
        var theme = 'light';
        try {
          var stored = localStorage.getItem('tms.theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          theme = stored === 'dark' || (stored !== 'light' && prefersDark) ? 'dark' : 'light';
        } catch (e) {}
        document.documentElement.classList.toggle('dark', theme === 'dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
