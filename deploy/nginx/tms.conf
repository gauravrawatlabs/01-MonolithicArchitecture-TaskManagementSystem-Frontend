# nginx site for a VM / EC2 without Docker (Ubuntu/Debian: /etc/nginx/sites-available/tms, then symlink it into
# sites-enabled; RHEL/Amazon Linux: /etc/nginx/conf.d/tms.conf). Steps: docs/17-Phase17-Deployment-and-GitHub.md.
#
#   /var/www/tms/                              ← the contents of dist/ (npm run build)
#   /var/www/tms/config.js                     ← edit: apiBaseUrl of your API (or build with VITE_API_BASE_URL)
#   /etc/nginx/snippets/tms-security-headers.conf
#        ← node scripts/host-configs.mjs nginx --api-origin https://api.example.com
#
# NOTE: an add_header inside a location DROPS all inherited add_header lines (nginx rule), so every location
# that sets a header also includes the security headers.
server {
    listen 80;
    listen [::]:80;
    server_name app.example.com; # your domain
    root /var/www/tms;
    server_tokens off;

    # HTTPS: let certbot (or your load balancer) handle TLS, e.g.  sudo certbot --nginx -d app.example.com

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = /config.js {
        include /etc/nginx/snippets/tms-security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location /assets/ {
        include /etc/nginx/snippets/tms-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/tms-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
