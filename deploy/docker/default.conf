# nginx site for the single-page app (non-root image: port 8080).
# NOTE: an add_header inside a location DROPS all inherited add_header lines (nginx rule), so every location
# that sets a header also includes the security headers.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Liveness probe for orchestrators (Docker HEALTHCHECK, Kubernetes, ECS, App Service).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Runtime configuration, written at start-up: never cached.
    location = /config.js {
        alias /etc/nginx/tms/config.js;
        default_type application/javascript;
        include /etc/nginx/tms/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # Fingerprinted build output (file names change with content): cache for a year.
    location /assets/ {
        include /etc/nginx/tms/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Everything else: real files, or index.html for client-side routes (/projects/7, /settings/account…).
    location / {
        include /etc/nginx/tms/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
