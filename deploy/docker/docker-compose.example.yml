# Example: run the frontend container on a VM / EC2 (copy next to your API's compose file and adjust).
#   docker compose -f docker-compose.example.yml up -d
# Put a TLS-terminating proxy (or a cloud load balancer) in front for HTTPS; the container itself speaks HTTP on 8080.
services:
  frontend:
    image: ghcr.io/gauravrawatlabs/01-monolithicarchitecture-taskmanagementsystem-frontend:latest
    # or build locally:  build: ../..
    restart: unless-stopped
    ports:
      - '80:8080'
    environment:
      API_BASE_URL: https://api.example.com # the public URL of the ASP.NET Core API
      APP_NAME: Task Management System
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /etc/nginx/tms:uid=101,gid=101
